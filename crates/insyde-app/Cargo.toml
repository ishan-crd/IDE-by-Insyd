[package]
name = "insyde-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "InsyDE desktop app (GPUI)."

[features]
# Compile Metal shaders at launch (~0.8s) so the app builds without Xcode's
# separately-downloaded Metal toolchain. For fast startup, install it
# (`xcodebuild -downloadComponent MetalToolchain`) and build with
# `--no-default-features` to precompile shaders at build time.
default = ["runtime-shaders"]
runtime-shaders = ["gpui_platform/runtime_shaders"]

[[bin]]
name = "insyde"
path = "src/main.rs"

[dependencies]
gpui.workspace = true
gpui_platform = { package = "gpui-pre-platform", version = "=0.3.6", features = ["font-kit"] }
gpui-component.workspace = true
gpui-kit-assets = "=0.6.6"
insyde-core.workspace = true
insyde-theme.workspace = true
anyhow.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
parking_lot.workspace = true
flume.workspace = true
smol.workspace = true
serde.workspace = true
serde_json.workspace = true
ignore.workspace = true

# File tree "Copy": put the file itself on the pasteboard (gpui only writes text/images).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = { version = "0.6", default-features = false, features = ["std"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSString", "NSURL"] }
