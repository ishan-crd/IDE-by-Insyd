[package]
name = "insyde-core"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "InsyDE core: git, worktrees, terminals, agents (ACP), project brain, persistence. No UI dependency."

[dependencies]
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
parking_lot.workspace = true
rusqlite.workspace = true
dirs.workspace = true
alacritty_terminal.workspace = true
agent-client-protocol.workspace = true
futures = "0.3"
smol.workspace = true
flume.workspace = true
similar = "3"
regex = "1"
toml = "1"
# Web access: WebSocket handshake hash and pairing QR codes.
sha1_smol = "1"
qrcode = { version = "0.14", default-features = false }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Move deleted files to the Trash (already in the tree via gpui).
[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSFileManager", "NSURL", "NSString", "NSError"] }
